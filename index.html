<html lang="bn"><head><meta charset="utf-8">

<title>প্রত্যাশা ফাউন্ডেশন – সদস্য হিসাব</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--tx:#1b2b26;--mu:#6b7c76;--g:#1f6f5b;--gl:#e8f3ef;--r:#c0392b;--rl:#fde8e6;--bd:#d9e2de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a17;--card:#1a2622;--tx:#e6efec;--mu:#93a59e;--g:#4fb69a;--gl:#1f3530;--r:#ff8a7a;--rl:#3a2220;--bd:#2c3d37}}
:root[data-theme="dark"]{--bg:#111a17;--card:#1a2622;--tx:#e6efec;--mu:#93a59e;--g:#4fb69a;--gl:#1f3530;--r:#ff8a7a;--rl:#3a2220;--bd:#2c3d37}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.5 'Noto Sans Bengali','Kalpurush',Arial,sans-serif;max-width:560px;padding:14px}
h1{font-size:19px;margin:6px 0;color:var(--g)}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
input{font:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);margin-top:8px}
button{font:inherit;width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:bold}
button.o{background:none;border:1px solid var(--bd);color:var(--tx)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:var(--gl);border-radius:10px;padding:10px}.k b{display:block;font-size:18px}
.st{padding:10px;border-radius:10px;font-weight:bold;margin-top:10px}.ok{background:var(--gl);color:var(--g)}.bad{background:var(--rl);color:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left}td:last-child,th:last-child{text-align:right}
th{color:var(--mu);font-weight:normal}.r{color:var(--r);font-weight:bold}.g{color:var(--g)}.e{color:var(--r)}
</style></head><body>
<h1>প্রত্যাশা (Protyasha) ফাউন্ডেশন</h1><div class="mu">সদস্যদের ব্যক্তিগত হিসাব</div>

<input id="pn" type="password" inputmode="numeric" placeholder="পিন (৮ সংখ্যা)" autocomplete="current-password">

async function dec(pin,r){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(r.s),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const all=b64(r.b);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(0,12)},key,all.slice(12))))}
const nd=s=>s.replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c)).replace(/\D/g,'');
async function login(){const r=DATA.find(x=>String(x.i)===nd($('id').value)),er=$('er');er.textContent='';
 if(!r||!nd($('pn').value)){er.textContent='আইডি বা পিন ভুল হয়েছে।';return}
 $('go').disabled=true;$('go').textContent='অপেক্ষা করুন…';
 try{show(await dec(nd($('pn').value),r))}catch(e){er.textContent='আইডি বা পিন ভুল হয়েছে।'}
 $('go').disabled=false;$('go').textContent='আমার হিসাব দেখুন'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(d){$('lg').hidden=true;$('pn').value='';const v=$('vw');v.hidden=false;
 const dt=new Date(d.asof).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
 v.innerHTML=`<div class="card"><b>স্বাগতম, ${esc(d.name)}</b> <span class="mu">(আইডি ${d.id})</span>
 <div class="mu">হিসাব হালনাগাদ: ${dt}</div>
 <div class="st ${d.od?'bad':'ok'}">${d.od?'বকেয়া আছে: Tk '+fmt(d.od):'আপনার কোনো বকেয়া নেই ✓'}</div></div>
 <div class="kp"><div class="k">আপনার মোট জমা<b>Tk ${fmt(d.total)}</b></div><div class="k">ফান্ডে আপনার অংশ<b>${(d.share*100).toFixed(1)}%</b></div>
 <div class="k">মাসিক জমা<b>Tk ${fmt(d.mp)}</b></div><div class="k">বাৎসরিক এককালীন জমা<b>Tk ${fmt(d.lp)}</b></div>
 <div class="k">ফান্ডে সদস্যদের মোট জমা<b>Tk ${fmt(d.fundTotal)}</b></div><div class="k">ফান্ডের নিট ব্যালেন্স<b>Tk ${fmt(d.fundNet)}</b></div></div>
 <div class="card"><b>মাসওয়ারি হিসাব</b><table><tr><th>মাস</th><th>অবস্থা</th><th>জমা (Tk)</th></tr>${d.rows.map(r=>{
 const full=r.v>=r.u,part=r.v>0&&!full;
 const s=full?'<span class="g">✓ জমা</span>':part?'<span class="r">আংশিক</span>':r.due?'<span class="r">বকেয়া</span>':'<span class="mu">আসন্ন</span>';
 return `<tr><td>${r.L?'<b>'+esc(r.l)+'</b>':esc(r.l)}</td><td>${s}</td><td>${r.v?fmt(r.v):'-'}</td></tr>`}).join('')}</table></div>
